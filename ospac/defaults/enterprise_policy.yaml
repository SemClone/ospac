version: "2.0"
name: "Default Enterprise Policy"
description: "Default policy for enterprise organizations with common compliance requirements"

rules:
  # Strong Copyleft Rules
  - id: no_gpl_in_products
    description: "Prevent GPL licenses in distributed products"
    priority: 10
    when:
      distribution_type: ["commercial", "embedded", "saas", "mobile", "desktop", "web"]
      license: ["GPL-2.0", "GPL-3.0", "GPL-2.0-only", "GPL-3.0-only", "GPL-2.0-or-later", "GPL-3.0-or-later"]
    then:
      action: deny
      severity: error
      message: "GPL licenses not allowed in commercial products due to viral copyleft requirements"
      remediation: "Replace with MIT, Apache-2.0, or BSD licensed alternative"

  - id: no_agpl_in_services
    description: "Prevent AGPL in network services"
    priority: 10
    when:
      distribution_type: ["saas", "cloud", "api"]
      license: ["AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"]
    then:
      action: deny
      severity: error
      message: "AGPL licenses require source disclosure for network services"
      remediation: "Use Apache-2.0 or MIT licensed alternatives"

  # The two rules above name individual licenses, which only covers the licenses somebody
  # remembered to list. The rules below match on license_type, so a copyleft license that
  # is not enumerated anywhere is still caught. AGPL-3.0 evaluated for commercial
  # distribution used to fall through every rule and come back permitted.
  - id: no_strong_copyleft_in_products
    description: "Prevent strong copyleft in distributed products, by category"
    priority: 9
    when:
      distribution_type: ["commercial", "embedded", "saas", "mobile", "desktop", "web"]
      license_type: "copyleft_strong"
    then:
      action: deny
      severity: error
      message: "Strong copyleft requires releasing the combined work under the same license"
      remediation: "Replace with a permissive alternative, or isolate the component behind a process boundary"

  - id: no_network_copyleft_in_services
    description: "Prevent network copyleft in hosted services, by category"
    priority: 9
    when:
      distribution_type: ["saas", "cloud", "api", "web"]
      license_type: "network_copyleft"
    then:
      action: deny
      severity: error
      message: "Network copyleft triggers source disclosure for users interacting over a network"
      remediation: "Replace with a permissive alternative, or accept the source disclosure obligation deliberately"

  - id: review_weak_copyleft_static
    description: "Weak copyleft is safe dynamically but needs review when statically linked"
    priority: 6
    when:
      linking_type: "static_linking"
      license_type: "copyleft_weak"
    then:
      action: flag_for_review
      severity: warning
      message: "Weak copyleft with static linking can extend the license to the combined work"
      notify: ["legal@company.com"]
      requirements:
        - "Prefer dynamic linking, or confirm the license permits static linking here"
        - "Provide a means to relink against a modified version of the component"

  # Weak Copyleft Rules
  - id: review_lgpl
    description: "Flag LGPL for legal review"
    priority: 5
    when:
      license: ["LGPL-2.1", "LGPL-3.0", "LGPL-2.1-only", "LGPL-3.0-only"]
      linking_type: "static_linking"
    then:
      action: flag_for_review
      severity: warning
      message: "LGPL with static linking requires legal review"
      notify: ["legal@company.com"]
      requirements:
        - "Ensure dynamic linking if using LGPL libraries"
        - "Provide means to replace LGPL component"
        - "Include LGPL license text"

  - id: allow_lgpl_dynamic
    description: "Allow LGPL with dynamic linking"
    priority: 3
    when:
      license: ["LGPL-2.1", "LGPL-3.0", "LGPL-2.1-only", "LGPL-3.0-only"]
      linking_type: "dynamic_linking"
    then:
      action: approve
      severity: info
      message: "LGPL allowed with dynamic linking"
      requirements:
        - "Include LGPL license text"
        - "Provide source or link to LGPL component"

  # Permissive License Rules
  #
  # This category rule was previously written only in the decision_tree section, which the
  # runtime never reads, so permissive licenses were approved solely by the enumerated
  # rules below. Anything not named there, ISC and Zlib for example, matched nothing at
  # all. That was invisible while an unmatched evaluation returned allow, and became
  # visible once it started returning flag_for_review.
  - id: approve_permissive
    description: "Approve permissive and public domain licenses by category"
    priority: 1
    when:
      license_type: ["permissive", "public_domain"]
    then:
      action: approve
      severity: info
      message: "Permissive and public domain licenses are pre-approved"
      requirements:
        - "Retain copyright notices and license text"

  - id: approve_mit
    description: "Automatically approve MIT license"
    priority: 1
    when:
      license: ["MIT", "MIT-0"]
    then:
      action: approve
      severity: info
      message: "MIT license approved for all uses"
      requirements:
        - "Include MIT license text"
        - "Preserve copyright notice"

  - id: approve_apache
    description: "Automatically approve Apache 2.0"
    priority: 1
    when:
      license: ["Apache-2.0"]
    then:
      action: approve
      severity: info
      message: "Apache 2.0 license approved for all uses"
      requirements:
        - "Include Apache 2.0 license text"
        - "Preserve copyright and NOTICE file if present"
        - "State changes made to the code"

  - id: approve_bsd
    description: "Automatically approve BSD licenses"
    priority: 1
    when:
      license: ["BSD-2-Clause", "BSD-3-Clause", "0BSD"]
    then:
      action: approve
      severity: info
      message: "BSD license approved for all uses"
      requirements:
        - "Include BSD license text"
        - "Preserve copyright notice"
        - "Do not use contributors' names for endorsement (BSD-3-Clause)"

  # Public Domain
  - id: approve_public_domain
    description: "Automatically approve public domain"
    priority: 1
    when:
      license: ["CC0-1.0", "Unlicense"]
    then:
      action: approve
      severity: info
      message: "Public domain dedication approved"

  # Special Cases
  - id: gpl_dev_tools
    description: "Allow GPL for development tools"
    priority: 2
    when:
      license: ["GPL-2.0", "GPL-3.0", "GPL-2.0-only", "GPL-3.0-only"]
      usage: ["development", "testing", "build"]
    then:
      action: approve
      severity: info
      message: "GPL allowed for development-only tools"
      requirements:
        - "Ensure tool is not distributed with product"
        - "Tool output must not contain GPL code"

  - id: review_commercial
    description: "Review commercial/proprietary licenses"
    priority: 5
    when:
      license_type: ["proprietary", "commercial"]
    then:
      action: flag_for_review
      severity: warning
      message: "Commercial license requires procurement and legal review"
      notify: ["legal@company.com", "procurement@company.com"]

  # NonCommercial licenses
  - id: no_noncommercial_in_commercial_products
    description: "Prevent NonCommercial licenses in anything shipped commercially"
    priority: 10
    when:
      distribution_type: ["commercial", "saas", "embedded", "mobile", "desktop", "web", "cloud", "api"]
      license_type: "noncommercial"
    then:
      action: deny
      severity: error
      message: "NonCommercial licenses forbid commercial use, including internal use that supports a commercial product"
      remediation: "Replace with a permissive alternative, or obtain a separate commercial licence from the rights holder"

  - id: review_noncommercial
    description: "Flag NonCommercial licenses outside commercial distribution"
    priority: 5
    when:
      license_type: "noncommercial"
    then:
      action: flag_for_review
      severity: warning
      message: "NonCommercial license: confirm the use really is non-commercial"
      notify: ["legal@company.com"]
      requirements:
        - "Confirm no commercial use, direct or indirect"
        - "Retain attribution and license text"

  # Deprecated Licenses
  - id: warn_deprecated
    description: "Warn about deprecated licenses"
    priority: 3
    when:
      license: ["GPL-2.0+", "GPL-3.0+", "LGPL-2.1+", "LGPL-3.0+"]
    then:
      action: flag_for_review
      severity: warning
      message: "License identifier is deprecated, use -only or -or-later suffix"

  # Unknown Licenses
  - id: review_unknown
    description: "Flag unknown licenses for review"
    priority: 7
    when:
      license_type: "unknown"
    then:
      action: flag_for_review
      severity: warning
      message: "Unknown license requires manual review"
      notify: ["legal@company.com"]

  # License Compatibility Rules
  - id: gpl2_apache_incompatible
    description: "GPL-2.0 and Apache-2.0 are incompatible"
    priority: 10
    when:
      license1: ["GPL-2.0", "GPL-2.0-only"]
      license2: ["Apache-2.0"]
    then:
      action: deny
      severity: error
      message: "GPL-2.0 and Apache-2.0 are incompatible due to patent clause conflicts"
      remediation: "Use GPL-3.0 (compatible with Apache-2.0) or choose different licenses"

  - id: apache_gpl2_incompatible
    description: "Apache-2.0 and GPL-2.0 are incompatible (reverse check)"
    priority: 10
    when:
      license1: ["Apache-2.0"]
      license2: ["GPL-2.0", "GPL-2.0-only"]
    then:
      action: deny
      severity: error
      message: "Apache-2.0 and GPL-2.0 are incompatible due to patent clause conflicts"
      remediation: "Use GPL-3.0 (compatible with Apache-2.0) or choose different licenses"

  - id: gpl2_gpl3_incompatible
    description: "GPL-2.0 and GPL-3.0 are incompatible"
    priority: 10
    when:
      license1: ["GPL-2.0", "GPL-2.0-only"]
      license2: ["GPL-3.0", "GPL-3.0-only"]
    then:
      action: deny
      severity: error
      message: "GPL-2.0 and GPL-3.0 are incompatible - cannot mix versions"
      remediation: "Use consistent GPL version across all components"

  - id: gpl3_gpl2_incompatible
    description: "GPL-3.0 and GPL-2.0 are incompatible (reverse check)"
    priority: 10
    when:
      license1: ["GPL-3.0", "GPL-3.0-only"]
      license2: ["GPL-2.0", "GPL-2.0-only"]
    then:
      action: deny
      severity: error
      message: "GPL-3.0 and GPL-2.0 are incompatible - cannot mix versions"
      remediation: "Use consistent GPL version across all components"

# The decision_tree section that used to sit here was never executed: the runtime
# reads only the 'rules' list above. Its entries duplicated rules that already
# exist, except the permissive approval, which has been ported to 'approve_permissive'.
# Config that looks authoritative but never runs is how several defects in this
# project went unnoticed, so it is removed rather than left as documentation.

obligations:
  attribution:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause

  include_license:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - GPL-2.0-only
    - GPL-3.0-only
    - LGPL-2.1-only
    - LGPL-3.0-only

  source_disclosure:
    conditions:
      - license: ["GPL-2.0-only", "GPL-3.0-only"]
        distribution: ["commercial", "embedded"]
      - license: ["LGPL-2.1-only", "LGPL-3.0-only"]
        linking: "static"

  state_changes:
    - Apache-2.0

  patent_grant:
    - Apache-2.0

  no_endorsement:
    - BSD-3-Clause
    - Apache-2.0

# Compatibility matrix overrides
compatibility:
  incompatible:
    - ["GPL-2.0-only", "GPL-3.0-only"]
    - ["GPL-2.0-only", "Apache-2.0"]  # Due to GPL-2.0 patent clause conflict
    - ["GPL-3.0-only", "BSD-4-Clause"]  # Due to advertising clause

  require_review:
    - ["MIT", "GPL-2.0-only"]  # One-way compatibility
    - ["Apache-2.0", "GPL-3.0-only"]  # One-way compatibility
    - ["LGPL-2.1-only", "LGPL-3.0-only"]