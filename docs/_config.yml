title: ospac
description: Open Source Policy as Code — license compliance policy engine
url: https://semclone.github.io
baseurl: /ospac

remote_theme: just-the-docs/just-the-docs

# Pages are linked as /commands/ rather than /commands.html
permalink: pretty

plugins:
  - jekyll-remote-theme

# Sidebar and search
search_enabled: true
search:
  heading_level: 2
  previews: 2

heading_anchors: true

# Several pages flag known issues (a fail-open in the policy templates, two stale
# formatters). just-the-docs only styles a callout if it is declared here — otherwise
# `{: .warning }` renders as an ordinary blockquote and the warning loses its emphasis.
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

aux_links:
  ospac on GitHub:
    - https://github.com/SemClone/ospac
  ospac on PyPI:
    - https://pypi.org/project/ospac/
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

footer_content: >
  Documentation for ospac, part of the SEMCL.ONE toolchain.
  Code licensed under Apache-2.0; the license dataset under CC BY-NC-SA 4.0.

# Link each page back to its source so fixes are easy to contribute
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/SemClone/ospac
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
